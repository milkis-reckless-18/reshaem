<svg width="680" height="320" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg">
  <title>Решаем logo</title>
  <desc>Решаем wordmark — (Resha)Σm, transparent background</desc>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Clash+Display:wght@700&amp;family=Instrument+Sans:wght@400;500&amp;display=swap');
    .word  { font-family: 'Clash Display', sans-serif; font-weight: 700; fill: #F0EEE6; }
    .sigma { font-family: 'Clash Display', sans-serif; font-weight: 700; fill: #5EECD8; }
    .tag   { font-family: 'Instrument Sans', sans-serif; font-weight: 500; fill: #5EECD8; letter-spacing: 0.04em; }
    .sub   { font-family: 'Instrument Sans', sans-serif; font-weight: 400; fill: rgba(240,238,230,0.5); letter-spacing: 0.02em; }
    .bg-sym { fill: #5EECD8; opacity: 0.045; font-family: 'Instrument Sans', sans-serif; font-size: 22px; }
  </style>

  <!-- Floating math symbols -->
  <text class="bg-sym" x="36"  y="52">∫</text>
  <text class="bg-sym" x="110" y="38">√</text>
  <text class="bg-sym" x="198" y="58">π</text>
  <text class="bg-sym" x="290" y="34">∑</text>
  <text class="bg-sym" x="378" y="55">∞</text>
  <text class="bg-sym" x="460" y="38">Δ</text>
  <text class="bg-sym" x="548" y="52">×</text>
  <text class="bg-sym" x="620" y="40">÷</text>
  <text class="bg-sym" x="52"  y="290">χ²</text>
  <text class="bg-sym" x="140" y="300">≠</text>
  <text class="bg-sym" x="230" y="288">θ</text>
  <text class="bg-sym" x="440" y="295">±</text>
  <text class="bg-sym" x="530" y="285">≈</text>
  <text class="bg-sym" x="618" y="298">β</text>

  <!-- Wordmark -->
  <text x="340" y="178" text-anchor="middle" font-size="108" letter-spacing="-2">
    <tspan class="word">(Resha)</tspan><tspan class="sigma">Σ</tspan><tspan class="word">m</tspan>
  </text>

  <!-- Tagline -->
  <text x="340" y="224" text-anchor="middle" class="tag" font-size="19.5">Пиши. Фоткай. Понимай.</text>

  <!-- Secondary line -->
  <text x="340" y="258" text-anchor="middle" class="sub" font-size="14.5">Ошибка? Хорошо. Разберёмся вместе.</text>

  <!-- Handwriting squiggle -->
  <path d="M 270 285 Q 300 278 320 285 Q 335 290 355 282 Q 370 276 400 285"
        stroke="#5EECD8" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
  <circle cx="400" cy="285" r="2.5" fill="#5EECD8" opacity="0.8"/>
</svg>
